<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(90deg, rgb(104, 196, 227) 0%, rgb(107, 97, 163) 100%);
      background-attachment: fixed;
      overflow: hidden;
      transition: background 1s;
    }

    @keyframes nascerPorDoSol {
      0% {
        top: 100vh; 
        opacity: 0;
      }
      25% {
        top: 50vh;
        opacity: 1;
      }
      50% {
        top: 30px; 
        opacity: 1;
      }
      75% {
        top: 50vh; 
        opacity: 1;
      }
      100% {
        top: 100vh;
        opacity: 0;
      }
    }

    .sol {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, yellow 60%, orange 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px 15px rgba(255, 255, 0, 0.5);
      animation: nascerPorDoSol 10s infinite ease-in-out;
      z-index: 2;
    }

    .onda {
      position: absolute;
      bottom: 0;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: white;
      font-family: sans-serif;
      margin-top: 20px;
      z-index: 2;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="sol"></div> 

  <div class="onda">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
      <path fill="#E35336"
        d="M0,288L34.3,272C68.6,256,137,224,206,224C274.3,224,343,256,411,250.7C480,245,549,203,617,192C685.7,181,754,203,823,186.7C891.4,171,960,117,1029,96C1097.1,75,1166,85,1234,128C1302.9,171,1371,245,1406,282.7L1440,320L0,320Z">
      </path>
    </svg>
  </div>

</body>
</html>
